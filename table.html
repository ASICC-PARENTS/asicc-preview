<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ASICC · PC 상품 편집 시안</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbfaf6;color:#2c2928;font:15px system-ui,sans-serif}header{border-bottom:1px solid #e7e2db;background:white;padding:17px 34px;font-weight:700}main{max-width:1390px;margin:26px auto;padding:0 24px}h1{margin:8px 0 4px;font-size:28px}p{margin:8px 0;color:#665b57}.panel{background:white;border:1px solid #ddd5cd;border-radius:12px;padding:18px;margin-top:20px}.bar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:12px}.bar h2{margin:0;font-size:20px}.sheet{overflow:auto;max-height:64vh;border:1px solid #dfd9d4;border-radius:6px}table{border-spacing:0;min-width:1480px;width:100%;table-layout:fixed}th{position:sticky;top:0;z-index:2;background:#f1e9e7;text-align:left;color:#543943}th,td{border-right:1px solid #e9e3de;border-bottom:1px solid #e9e3de;padding:6px 8px;height:37px}tbody tr:nth-child(even){background:#faf8f7}tbody tr:nth-child(odd){background:white}tr:hover{background:#f6f0ee!important}.fixed{position:sticky;left:0;background:inherit;z-index:1}th.fixed{background:#f1e9e7;z-index:3}input:not([type=checkbox]),textarea{font:inherit;width:100%;border:1px solid transparent;background:transparent;padding:4px;min-width:0}input:focus,textarea:focus{outline:2px solid #87344d;border-radius:3px}input[type=checkbox]{accent-color:#87344d}button{font:inherit;border:1px solid #dfd0d3;background:#fff;border-radius:6px;padding:5px 9px;color:#76344a;cursor:pointer}.primary{background:#87344d;color:white;border-color:#87344d}.description{width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left}.photo{display:flex;gap:6px;align-items:center}.photo img{width:25px;height:23px;object-fit:cover;border-radius:3px}dialog{width:min(570px,90vw);padding:22px;border:1px solid #d9c6cc;border-radius:10px}dialog::backdrop{background:#24161e55}textarea{border:1px solid #ccbbc1;margin:10px 0}.actions{display:flex;gap:8px;margin-top:14px}
</style>
<header>ASICC　 ·　 온라인 바자회 관리</header><main>
<p><a href="/">캡처 목록</a> · 디자인 검토용 시안</p>
<h1>새 바자회 · 상품 편집</h1><p>예시 상품 24개 · 한국어와 프랑스어를 각각 직접 입력</p>
<section class="panel"><div class="bar"><div><h2>이번 바자회 상품</h2><p>이름·가격·수량은 셀에서 수정하고, 설명과 사진은 셀을 눌러 편집합니다.</p></div><button id="add">+ 상품 추가</button></div>
<div class="sheet" tabindex="0" aria-label="상품 편집 표. 오른쪽으로 스크롤하면 추가 열이 표시됩니다."><table><colgroup><col style="width:74px"><col style="width:160px"><col style="width:165px"><col style="width:188px"><col style="width:188px"><col style="width:112px"><col style="width:101px"><col style="width:104px"><col style="width:104px"><col style="width:112px"><col style="width:172px"></colgroup>
<thead><tr><th class="fixed">판매 포함</th><th>상품명 · 한국어</th><th>상품명 · 프랑스어</th><th>설명 · 한국어</th><th>설명 · 프랑스어</th><th>박스 매입가 €</th><th>판매가 €</th><th>박스당 수량</th><th>사진</th><th>공급업체</th><th>보관·판매 한도</th></tr></thead><tbody></tbody></table></div>
<div class="actions"><button class="primary" id="save">임시저장</button><button disabled>발행</button><button disabled>임시저장 삭제</button><span id="status" role="status"></span></div></section>
<dialog><form method="dialog"><h2 id="detailTitle">설명 편집</h2><textarea aria-label="상품 설명" rows="6"></textarea><div id="photoEdit" hidden><img src="sample.jpg" width="150" alt="예시 상품 사진"><p><label>사진 파일 선택 <input type="file" accept="image/*"></label></p></div><button value="cancel">취소</button> <button class="primary" value="confirm">셀에 적용</button></form></dialog>
<script>
const products=[['사과','Pommes'],['쌀','Riz'],['국수','Nouilles'],['김치','Kimchi'],['배','Poires'],['감자','Pommes de terre'],['보리차','Thé d’orge'],['참기름','Huile de sésame']];const tbody=document.querySelector('tbody'),dialog=document.querySelector('dialog'),area=dialog.querySelector('textarea');let target;
function add(i){const row=tbody.insertRow(),item=products[i%products.length];row.innerHTML='<td class="fixed"><label><input type="checkbox" checked> 포함</label></td>';
for(const [label,value,type] of [['한국어 상품명',item[0]+' '+(i+1),'text'],['프랑스어 상품명',item[1]+' '+(i+1),'text'],['한국어 설명','예시 상품의 원산지와 구성 안내','detail'],['프랑스어 설명','Origine et composition du produit','detail'],['박스 매입가',14+i,'number'],['판매가',4+i/4,'number'],['박스당 수량',12,'number'],['사진','사진','photo'],['공급업체','예시 공급처','text'],['보관 및 판매 한도','상온 · 20개','text']]){const cell=row.insertCell();const el=document.createElement(['detail','photo'].includes(type)?'button':'input');el.setAttribute('aria-label',label);if(type==='detail'||type==='photo'){el.className=type==='detail'?'description':'photo';if(type==='photo'){const image=new Image();image.src='sample.jpg';image.alt='';el.append(image);}el.append(document.createTextNode(value));el.onclick=()=>{target=type==='detail'?el:null;detailTitle.textContent=item[0]+' · '+label;area.hidden=type!=='detail';photoEdit.hidden=type!=='photo';area.value=type==='detail'?el.textContent:'';dialog.showModal();};}else{el.type=type;el.value=value;if(type==='number')el.step='any';}cell.append(el);}}
for(let i=0;i<24;i++)add(i);document.querySelector('#add').onclick=()=>{add(tbody.rows.length);tbody.rows[tbody.rows.length-1].scrollIntoView({block:'nearest'});};dialog.addEventListener('close',()=>{if(dialog.returnValue==='confirm'&&target)target.textContent=area.value;});save.onclick=()=>{status.textContent='시안에서만 표시되는 저장 상태입니다.';};
</script></main></html>
